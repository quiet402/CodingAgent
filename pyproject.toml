[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-coding-agent"
version = "0.5.0"
description = "A small auditable coding agent built without agent frameworks"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
forge = "forge_agent.cli:main"
forge-agent = "forge_agent.cli:main"

[tool.setuptools.packages.find]
include = ["forge_agent*"]
